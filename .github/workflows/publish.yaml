# Publishing the SDK as `open-meridian`.
#
# A release is a decision somebody makes, and it is made at the `pypi`
# environment's approval, not at the trigger (ruled 2026-10-06: an agent starts
# the release, the product owner approves it on GitHub). Pushing a tag
# `v<version>` naming pyproject.toml's version starts a real upload, which then
# waits there for a required reviewer; nothing reaches PyPI or GHCR before that
# approval. By hand, the same workflow uploads to TestPyPI, or to PyPI through
# the same approval.
#
# No token anywhere: PyPI's trusted publishing lets this one workflow, in this
# one repository, prove who it is with GitHub's own identity, and the index
# admits nothing else. Set up on each index by the product owner -- project
# `open-meridian`, owner `open-meridian`, repository `meridian-python`,
# workflow `publish.yaml`, and on PyPI environment `pypi`.
#
# TestPyPI first, and by default. PyPI never lets a version be used twice, so a
# first real upload with a mistake in it spends that version for good; the test
# index is the same handshake and the same wheel at no cost. A test upload is
# versioned `<version>.dev<run>`, so it can run as often as it needs to and
# never takes the number the real upload will have.
#
# The same checks the pre-push gate runs on the package, then the wheel those
# checks passed. An index refuses a version it already has, so running this
# twice for one version publishes once.
name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      index:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # PyPI's publisher names this environment and admits a token from no
    # other, so a real upload can be held for approval in the repository's
    # settings. A test upload runs in none: an empty name is no environment.
    environment: ${{ (github.event_name == 'push' || inputs.index == 'pypi') && 'pypi' || '' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # A tag is a request to release the version it names, so it must name the
      # one this commit builds; a mistyped tag stops here, before the approval
      # is asked for.
      - name: The tag names pyproject.toml's version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::tag $TAG does not name pyproject.toml's version ${version}"
            exit 1
          fi

      - name: The bundled wire bindings are the pinned schema revision
        run: make check-vendored

      # Before anything is built, so the checks below run on the wheel that is
      # uploaded, version and all.
      - name: A test upload is a development version
        if: github.event_name != 'push' && inputs.index == 'testpypi'
        env:
          RUN: ${{ github.run_number }}
        run: |
          set -euo pipefail
          sed -i -E "s/^version = \"([^\"]+)\"/version = \"\1.dev${RUN}\"/" pyproject.toml
          grep -E '^version = ".+\.dev[0-9]+"' pyproject.toml

      - name: The package installs alone, with nothing by URL
        run: make package
        env:
          DOCKER_BUILDKIT: "1"

      - name: The wheel that was checked
        run: DOCKER_BUILDKIT=1 docker build -f Dockerfile.python --target dist --output type=local,dest=dist .

      - name: To TestPyPI
        if: github.event_name != 'push' && inputs.index == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: To PyPI
        if: github.event_name == 'push' || inputs.index == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1

  # The plugin base image, `ghcr.io/open-meridian/plugin-python:<version>`, for
  # a real release only and only once PyPI has the version: it installs
  # open-meridian from PyPI, so the base holds exactly what PyPI serves
  # (spec/the-local-plugin-registry). Both architectures, because a plugin is
  # built on a developer's machine and run on a cluster's, and the two are
  # often not the same.
  #
  # Never overwritten. A tag that exists already is a refusal, not a push:
  # plugins built on a base keep that base's layers, and a moved tag would
  # give two plugins that say the same SDK two different ones.
  base-image:
    needs: publish
    if: github.event_name == 'push' || inputs.index == 'pypi'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: The version, from pyproject.toml
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # PyPI's index reaches its mirrors a little after the upload is
      # accepted: 0.3.0's base failed to find 0.3.0 seconds after publishing
      # it. Waited for here rather than retried by hand.
      - name: Until PyPI serves the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if pip download --quiet --no-deps --dest /tmp/served "open-meridian==${VERSION}" 2>/dev/null; then
              echo "PyPI serves open-meridian ${VERSION}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::PyPI never served open-meridian ${VERSION} within ten minutes"
          exit 1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse a tag that exists already
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/plugin-python:${{ steps.version.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::$IMAGE exists already; a base is never overwritten"
            exit 1
          fi

      # Served to the wait above is not served everywhere yet: 0.20.0's build
      # found no 0.20.0 at PyPI seconds after the wait saw it, from another of
      # PyPI's mirrors. So a failed build is tried once more, two minutes on.
      - id: build
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.python
          target: plugin-base
          platforms: linux/amd64,linux/arm64
          build-args: |
            SDK_VERSION=${{ steps.version.outputs.version }}
            SDK_INSTALL=open-meridian==${{ steps.version.outputs.version }}
          tags: ghcr.io/${{ github.repository_owner }}/plugin-python:${{ steps.version.outputs.version }}
          push: true

      - name: Two minutes for PyPI's mirrors, then once more
        if: steps.build.outcome == 'failure'
        run: sleep 120

      - if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.python
          target: plugin-base
          platforms: linux/amd64,linux/arm64
          build-args: |
            SDK_VERSION=${{ steps.version.outputs.version }}
            SDK_INSTALL=open-meridian==${{ steps.version.outputs.version }}
          tags: ghcr.io/${{ github.repository_owner }}/plugin-python:${{ steps.version.outputs.version }}
          push: true
