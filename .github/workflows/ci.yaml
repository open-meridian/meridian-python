# CI is confirmation, not the first place a failure is found. The pre-push hook
# runs the same target locally, so a red run here means the hook was bypassed or
# the runner differs from a developer's machine -- both worth knowing.
#
# The single job is named for the make target it runs. ci-mirror-check enforces
# that correspondence from inside ci-local, so a job added here without a target
# fails the build rather than quietly escaping local reproduction.
#
# This job runs ci-remote rather than ci-local, and the difference is one gate.
# Conformance reads the contract's pinned bytes, which live in meridian-design
# and are deliberately not vendored here, because a vendored copy is a copy that
# drifts and drift is what the gate detects. That repo is private, so reaching
# it from here would put a credential that reads private source into a public
# repository. Ruled out on 2026-09-12.
#
# The gate still runs, twice. `make ci-local` includes it and the pre-push hook
# runs ci-local, so no push from a workspace can break it. meridian-design's CI
# runs the same suite against its own fixtures, and being private it may.
#
# What neither covers is a commit made through GitHub's web interface. That is a
# real hole and it is named here rather than papered over; design's next run
# closes it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything ci-local runs except conformance, which reads the contract's
  # pinned bytes from meridian-design. That repo is private, and reaching it
  # from here would mean a public repository holding a credential that reads
  # private source. Ruled out 2026-09-12.
  #
  # The gate is not dropped. It runs in meridian-design's CI, which is private
  # and already checks out every sibling, and it runs in `make ci-local` here,
  # which the pre-push hook fires, so a push that breaks it does not happen from
  # a workspace. What is missing is confirmation on a run started from GitHub
  # alone, and that window is named rather than papered over.
  ci-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the base commit resolves.
          fetch-depth: 0

      # The gate needs a range to police. A default checkout is shallow and
      # detached, with no upstream and no origin/main, and the tool now fails
      # rather than passing on that. See the review finding on meridian-core#5,
      # where it reported success having inspected nothing.
      - name: Resolve the contract-diff base
        run: |
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push)         base="${{ github.event.before }}" ;;
            *)            base="" ;;
          esac
          # A branch's first push reports an all-zero "before", and a manual run
          # has no range at all. HEAD against itself inspects nothing, which is
          # the right answer there: nothing arrived to inspect.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD)"
          fi
          echo "CONTRACT_DIFF_BASE=$base" >> "$GITHUB_ENV"

      - name: make ci-remote
        run: make ci-remote
