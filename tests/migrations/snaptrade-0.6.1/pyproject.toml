[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snaptrade"
version = "0.3.1"
description = "Holdings, cash and sync state from brokerages through SnapTrade"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# The SDK and nothing else of Meridian's, pinned exactly. The Dockerfile's base
# is the same version.
dependencies = [
  "open-meridian==0.6.1",
  "snaptrade-python-sdk==13.0.27",
]

[project.scripts]
snaptrade = "snaptrade.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.meridian]
roles = ["custody"]
interface = true
