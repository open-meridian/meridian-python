[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "listed"
version = "0.1.0"
description = "A listed options desk's helpers, cut to how it imports the SDK's topic modules"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# The SDK and nothing else of Meridian's, pinned exactly. The Dockerfile's base
# is the same version.
dependencies = ["open-meridian==0.34.0"]

[project.scripts]
listed = "listed.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.meridian]
roles = ["reporting"]
