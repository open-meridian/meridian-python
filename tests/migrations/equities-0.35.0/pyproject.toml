[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equities"
version = "0.1.0"
description = "A listings and chains data plugin in Massive's shape, with the copies the fit review found"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# The SDK and nothing else of Meridian's, pinned exactly.
dependencies = ["open-meridian==0.35.0"]

[project.scripts]
equities = "equities.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.meridian]
roles = ["data"]
