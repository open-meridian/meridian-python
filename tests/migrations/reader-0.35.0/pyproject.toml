[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reader"
version = "0.1.0"
description = "A reader's three roles in Alpaca's shape, cut to how 0.34.0 wired them"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
# The SDK and nothing else of Meridian's, pinned exactly. The Dockerfile's base
# is the same version.
dependencies = ["open-meridian==0.35.0"]

[project.scripts]
reader = "reader.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.meridian]
roles = ["reporting"]
