[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-meridian"
version = "0.1.0"
description = "Build Meridian plugins"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"

# Published to PyPI as `open-meridian` and imported as `meridian`: the name
# `meridian-sdk` there is an unrelated company's, and a plugin naming it would
# install their code. The wire bindings ship inside this package as
# `meridian.v1`, at the schema revision SCHEMA_REV in the Makefile pins --
# vendored rather than depended on, because PyPI refuses a dependency by URL
# and a range would let a plugin build against types the runtime beside it
# does not have, which shows up as a decode failure in a customer's cluster.
dependencies = [
  "grpcio>=1.68,<2",
  "protobuf>=5.28,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "grpcio-tools>=1.68,<2",
  "mypy>=1.11",
  "grpc-stubs>=1.53",
  "types-protobuf>=5.28",
  "ruff>=0.6",
  "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

# The bindings' type stubs, and the marker that says this package is typed.
[tool.setuptools.package-data]
meridian = ["py.typed", "v1/*.pyi"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]
# Generated by meridian-schema and copied in; styling it would be editing it.
extend-exclude = ["src/meridian/v1"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# This package's own name, whichever of its modules happen to exist where
# ruff runs: meridian-core's domain messages are generated into meridian.v1
# only inside the test image, and without this their imports sorted one way
# there and another way everywhere else.
[tool.ruff.lint.isort]
known-first-party = ["meridian"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
exclude = ["src/meridian/v1/"]
# The bindings ship .pyi for the messages, so those are type-checked where the
# SDK uses them. The gRPC stubs have none -- grpcio-tools does not emit them --
# and typing somebody else's generated code by hand is not ours to do, so
# those two modules are read as untyped.
[[tool.mypy.overrides]]
module = ["meridian.v1.sidecar_pb2_grpc", "meridian.v1.envelope_pb2_grpc"]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
