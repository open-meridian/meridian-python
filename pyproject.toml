[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meridian-sdk"
version = "0.1.0"
description = "Build Meridian plugins"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"

# Pinned to a schema revision, exactly as the Rust workspace pins meridian-pb.
# A range here would let a plugin build against types the runtime beside it does
# not have, and the symptom would be a decode failure in a customer's cluster.
dependencies = [
  "meridian-pb @ git+https://github.com/open-meridian/meridian-schema.git@263a6ad8ff7d3f923c0022b4698b049d08b3b8f1#subdirectory=gen/python",
  "grpcio>=1.68,<2",
  "protobuf>=5.28,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "grpcio-tools>=1.68,<2",
  "mypy>=1.11",
  "grpc-stubs>=1.53",
  "types-protobuf>=5.28",
  "ruff>=0.6",
  "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 96
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
# The generated package ships .pyi for the messages but not for the gRPC stubs,
# which grpcio-tools does not emit. Typing those by hand would be typing
# somebody else's generated code.
[[tool.mypy.overrides]]
module = ["meridian.v1.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
