summary = """
Fixes, with no contract change: the row-key rule in the SDK's helpers, before
core enforces it (spec/the-lake rule 5, ruled 2026-11-12: a row key fixes its
valid time and its first subject, and a restatement changing either is
refused naming the field). helpers.chains.statistic is valid from the start
